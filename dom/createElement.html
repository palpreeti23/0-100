<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>haeding</h1>
    <p>a new paraghraph</p>
    <ul id="parentNode">
        <li>code</li>
        <li>js</li>
        <li>more</li>
    </ul>

    <form action="" id="frm">
        <input type="text" name="fname" id="fname">
        <input type="text" name="lname" id="lname">
        <button onclick="showFun()">click here</button>
        <div id="demo"></div>
    </form>

   

    <script>
       const div = document.createElement('div');
       div.innerHTML = 'wow new div'
       document.body.appendChild(div)

       //append or add new child
       const parent = document.getElementById('parentNode');
       const newLi = document.createElement('li')
       newLi.innerHTML = 'and many more';
       newLi.style.fontFamily = 'cursive'
       newLi.style.backgroundColor ='blue'
       parent.appendChild(newLi)

       //remove child
    //    const removeLi = document.querySelector('li:nth-child(2)')
    //    parent.removeChild(removeLi);
    //    parent.removeChild(parent.firstElementChild)
    //    parent.removeChild(parent.lastElementChild)

       //replace child
    // parent.replaceChild(parent.firstElementChild, parent.lastElementChild)
    //    parent.replaceChild(parent.children[1],parent.children[2])

    //insert child
    parent.insertBefore(parent.lastElementChild, parent.children[2])

    parent.style.backgroundColor = 'green'

    </script>

    <script>
        function showFun(){
            const form = document.forms['frm'];
        let txt =' ';
        for(let i = 0; i< form.length ; i++){
            txt += form.elements[i].value + '<br>'
        }
        document.getElementById('demo').innerHTML = txt;
        }
 
    </script>
</body>
</html>
